# ChangeEvaluator — hermes adapter contract（照 agents/search-reviewer 的 adapter-contract-v1）
# 這個代理人是 Phase 3 閘 2：對 pending_review 提案只回 accept／reject，不提案、不改提案、不套用。
# risk_profile 設 high：它的 accept 會經 apply-change.mjs 真的寫進 production prompt／config。
# 所有 approval 都是 manual_only；learning.mode 只在 shadow；沒有任何自動改 skill／改工具範圍的權限。
schema_version: adapter-contract-v1
project_id: changeevaluator
display_name: ChangeEvaluator
role: judgment-agent
risk_profile: high

read_scope:
  - AGENTS.md
  - CHANGE_RUBRIC.md
  - skills/
  - memory/principles.md
  - memory/MEMORY.md
  - golden/manifest.json

# 唯一可寫的檔；而且 Phase 3 規則是判例仍由人手動寫入，代理人本身不寫。
write_scope:
  - memory/precedents.jsonl

deny_read_write_paths:
  - .env
  - .env*
  - secrets/
  - "**/*.key"
  - "**/credentials*"
  - ../../data/agent/*.json
  - ../../data/latest.json
  - ../../data/index.json
  - ../../scripts/prompts/*.md
  - ../../assets/js/config.js
  - ../../scripts/tier-b-domains.json
  - ../../agents/_control/**
  - ../../agents/search-reviewer/**
  - ../../.github/**
  - ../../scripts/agent/apply-change.mjs
  - ../../scripts/agent/canary-check.mjs

read_only_paths: []

# 從 agents/change-evaluator/ 目錄執行
test_commands:
  - node ../../scripts/agent/build-change-eval-input.mjs --self-test
  - bash ../../scripts/agent/promote.sh --self-test
  # S3-B 接上 driver 後追加：python3 ../../scripts/newshub_change_evaluator.py --selftest

learning:
  mode: shadow
  shared_learning: ranking_only
  shared_ledger: false
  decisions_ledger: memory/precedents.jsonl

approval:
  high_risk: manual_only
  publish: manual_only

agent_outputs:
  assessment: data/agent/.preview/change-eval.json
  precedents: memory/precedents.jsonl
  learning_status: memory/learning-status.json

skills:
  - skill_id: evidence-reconciliation
    source: project
    path: skills/evidence-reconciliation
    skill_doc: skills/evidence-reconciliation/SKILL.md
    risk_profile: high
    learning:
      mode: shadow
      shared_learning: ranking_only
      raw_events: private
    allowed_autonomy:
      ranking: true
      trigger_tuning: false
      example_selection: true
      eval_selection: true
      doc_patch_proposal: true
      direct_skill_patch: false
      tool_scope_change: false
    evidence:
      eval_commands:
        - node ../../scripts/agent/build-change-eval-input.mjs --self-test
      required_controls:
        - golden/manifest.json suites.cases 全過（gate hard）
        - CE-1 對帳只用輸入 metrics_window，不讀 metrics-history.jsonl 本體
  - skill_id: reversibility-check
    source: project
    path: skills/reversibility-check
    skill_doc: skills/reversibility-check/SKILL.md
    risk_profile: high
    learning:
      mode: shadow
      shared_learning: ranking_only
      raw_events: private
    allowed_autonomy:
      ranking: true
      trigger_tuning: false
      example_selection: true
      eval_selection: true
      doc_patch_proposal: true
      direct_skill_patch: false
      tool_scope_change: false
    evidence:
      eval_commands:
        - node ../../scripts/agent/build-change-eval-input.mjs --self-test
      required_controls:
        - 配額數字只讀輸入 quota 區塊（來源 agents/_control/canaries.json），程式碼與 rubric 不寫死常數
        - rollback 缺時 reject，不代填
  - skill_id: injection-detection
    source: project
    path: skills/injection-detection
    skill_doc: skills/injection-detection/SKILL.md
    risk_profile: high
    learning:
      mode: shadow
      shared_learning: ranking_only
      raw_events: private
    allowed_autonomy:
      ranking: true
      trigger_tuning: false
      example_selection: true
      eval_selection: true
      doc_patch_proposal: true
      direct_skill_patch: false
      tool_scope_change: false
    evidence:
      eval_commands:
        - node ../../scripts/agent/build-change-eval-input.mjs --self-test
      required_controls:
        - golden/manifest.json suites.redteam 全過（offline_must_survive）
        - security_flag 命中的分類本輪其餘提案一併 reject
