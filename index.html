<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#06080f">
<title>AI News Hub</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>

<!-- HEADER -->
<header class="hdr">
  <div class="hdr-inner">
    <div class="hdr-left">
      <div class="hdr-logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/><path d="M5 3v4"/><path d="M19 17v4"/><path d="M3 5h4"/><path d="M17 19h4"/></svg></div>
      <div>
        <div class="hdr-title">AI News Hub</div>
        <div class="hdr-date" id="hDate"></div>
      </div>
    </div>
    <nav class="sec-tabs" id="secTabs"></nav>
    <div class="hdr-right">
      <span class="hdr-pill ok" id="hPill"><span class="hdr-dot"></span> <span id="hPillText">載入中</span></span>
      <span class="hdr-info" id="hValidation"></span>
      <span class="hdr-info" id="hTime"></span>
      <button class="srch-toggle" id="syncBtn" style="display:none">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19a4.5 4.5 0 0 0 0-9h-1.8A7 7 0 1 0 4 15.7"/><polyline points="8 17 12 21 16 17"/><line x1="12" x2="12" y1="12" y2="21"/></svg>
        同步
      </button>
      <button class="srch-toggle" id="srchToggleBtn" onclick="toggleSearch()">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        搜尋
      </button>
    </div>
  </div>
  <div class="srch-bar" id="srchBar" style="display:none">
    <div class="srch-inner">
      <input class="srch-field" id="srchField" type="search" placeholder="搜尋全部類別（標題、摘要、來源、機構…）" oninput="onSrchInput(this.value)" onkeydown="if(event.key==='Escape')toggleSearch()">
      <button class="srch-close" onclick="toggleSearch()">✕ 關閉</button>
    </div>
  </div>
</header>

<!-- BANNERS -->
<div id="banners"></div>

<!-- NEWS SUBTABS -->
<nav class="sub-tabs" id="subTabs"></nav>

<!-- CONTENT -->
<main class="content">
  <div class="sec-head">
    <div><h2 class="sec-title" id="secTitle"></h2><span class="sec-count" id="secCount"></span></div>
    <span class="sec-updated" id="secUpdated"></span>
  </div>
  <div id="panel-search" class="panel"></div>
  <div id="panel-bookmarks" class="panel"></div>
  <div id="panel-papers" class="panel on"></div>
  <div id="panel-news" class="panel">
    <div id="sub-topnews" class="sub-panel on"></div>
    <div id="sub-taiwan" class="sub-panel"></div>
    <div id="sub-china" class="sub-panel"></div>
    <div id="sub-usa" class="sub-panel"></div>
    <div id="sub-techtrends" class="sub-panel"></div>

    <div id="sub-governance" class="sub-panel"></div>
    <div id="sub-tutorials" class="sub-panel"></div>
    <div id="sub-courses" class="sub-panel"></div>
  </div>
  <div id="panel-models" class="panel"></div>
  <div id="panel-history" class="panel"></div>
</main>

<!-- AUTH MODAL (Firebase 雲端書籤同步) -->
<div class="ov" id="authOv" onclick="closeAuthModal()"></div>
<div class="auth-modal" id="authModal">
  <div class="auth-head"><span>☁ 雲端同步</span><button onclick="closeAuthModal()" aria-label="關閉">✕</button></div>
  <p>用 Email 與密碼登入，書籤即可在 iPhone 與桌面之間自動同步。首次使用請先「註冊」。</p>
  <input id="fbEmail" type="email" autocomplete="username" placeholder="Email">
  <input id="fbPw" type="password" autocomplete="current-password" placeholder="密碼（至少 6 碼）" onkeydown="if(event.key==='Enter')fbLogin()">
  <div id="fbMsg"></div>
  <div class="auth-actions">
    <button onclick="fbLogin()">登入</button>
    <button onclick="fbSignup()">註冊</button>
  </div>
</div>

<!-- Firebase SDK (compat, v10.13.2) — 與 NeuroLearn 同版本 -->
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>

<!-- App modules (classic scripts，共用全域作用域，載入順序不可調換) -->
<script src="assets/js/config.js"></script>
<script src="assets/js/firebase.js"></script>
<script src="assets/js/bookmarks.js"></script>
<script src="assets/js/search.js"></script>
<script src="assets/js/render.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/history.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/main.js"></script>
</body>
</html>
