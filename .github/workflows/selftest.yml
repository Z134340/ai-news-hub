name: 離線自測

# L-9（2026-09-11）：只跑各腳本的 --self-test／--selftest，全部走 fixtures，不打外網、不讀 ~/.ai-news-hub、不寫 data/。
# 刻意不跑：scripts/agent/promote.sh --self-test（P-2 依本機 .preview 狀態而變，且 promote 紅線不動）、
# scripts/newshub_roadmap.py --selftest（依賴同機的 Hermes-Agent/curator/TECH_RUBRIC.md，runner 上無此檔）。
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          package-manager-cache: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      - name: GitHub Actions semantic validation
        env:
          ACTIONLINT_VERSION: '1.7.12'
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          ACTIONLINT_ARCHIVE="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --location --silent --show-error \
            --output "$ACTIONLINT_ARCHIVE" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$ACTIONLINT_ARCHIVE" | sha256sum --check --strict
          tar -xzf "$ACTIONLINT_ARCHIVE" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck= .github/workflows/*.yml

      - name: Node self-tests
        run: |
          set -euo pipefail
          for f in check-signal-health discover-trends build-insights build-search-review-input \
                   build-change-eval-input build-category-metrics build-weekly-report build-timeline \
                   build-roadmap-input build-review-packet build-current-state-manifest build-system-status \
                   canary-check apply-change replay-learning read-slack-picks pull-feedback freshness-release-gate; do
            echo "::group::$f --self-test"
            node "scripts/agent/$f.mjs" --self-test
            echo "::endgroup::"
          done
          echo "::group::check-agent-outputs --strict --self-test-boundary"
          node scripts/agent/check-agent-outputs.mjs --strict --self-test-boundary
          echo "::endgroup::"

      - name: Shell self-tests
        run: |
          set -euo pipefail
          echo "::group::run-agents.sh --self-test"
          bash scripts/run-agents.sh --self-test
          echo "::endgroup::"
          echo "::group::slack-notify.sh --self-test"
          bash scripts/agent/slack-notify.sh --self-test
          echo "::endgroup::"

      - name: Python self-tests
        run: |
          set -euo pipefail
          python3 scripts/validate.py --self-test
          for f in newshub_agents newshub_brief newshub_search_reviewer newshub_change_evaluator; do
            echo "::group::$f --selftest"
            python3 "scripts/$f.py" --selftest
            echo "::endgroup::"
          done

      - name: Frontend and pipeline regressions
        run: |
          set -euo pipefail
          for f in assets/js/*.js; do node --check "$f"; done
          node --check scripts/build-site.mjs
          node --check scripts/build-release-manifest.mjs
          node --check scripts/post-deploy.mjs
          node --check scripts/deployment-notification.mjs
          node --check scripts/fetch-skills.mjs
          bash -n scripts/run-daily.sh
          bash -n scripts/supplement-run.sh
          node --test scripts/tests/frontend.test.mjs scripts/tests/trend-topics.test.mjs scripts/tests/fetch-skills.test.mjs scripts/tests/release-manifest.test.mjs scripts/tests/post-deploy.test.mjs scripts/tests/deployment-workflows.test.mjs
          python3 -B -m unittest discover -s scripts/tests -p 'test_*.py' -v

      - name: Build Cloudflare Pages artifact
        run: |
          set -euo pipefail
          node scripts/build-site.mjs
          test -f dist/index.html
          test -f dist/_headers
          test -f dist/data/latest.json
          test -f dist/data/release-manifest.json
          test ! -e dist/scripts
          test ! -e dist/docs
          test ! -e dist/schemas
          test ! -e dist/data/agent/.preview
          test -z "$(find dist -iname '*receipt*' -print -quit)"
          rm -rf dist

      - name: Working tree untouched
        run: |
          if [ -n "$(git status --porcelain)" ]; then git status --porcelain; echo '自測寫了檔案'; exit 1; fi
