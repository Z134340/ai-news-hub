name: Verified Production Notification

on:
  workflow_call:
    inputs:
      receipt_artifact:
        required: true
        type: string
      deploy_sha:
        required: true
        type: string
      release_id:
        required: true
        type: string
      receipt_file:
        required: false
        default: deployment-receipt.json
        type: string

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: production-notify-${{ inputs.deploy_sha }}-${{ inputs.release_id }}
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.deploy_sha }}

      - name: Download immutable verification receipt
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.receipt_artifact }}
          path: ${{ runner.temp }}/verified-receipt

      - name: Require verified receipt identity
        run: >-
          node scripts/post-deploy.mjs inspect
          --receipt "${{ runner.temp }}/verified-receipt/${{ inputs.receipt_file }}"
          --status verified
          --deploy-sha "${{ inputs.deploy_sha }}"
          --release-id "${{ inputs.release_id }}"

      - name: Create idempotent verified notification
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          RECEIPT_PATH: ${{ runner.temp }}/verified-receipt/${{ inputs.receipt_file }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const {pathToFileURL} = require('url');
            const helpers = await import(pathToFileURL(path.join(process.env.GITHUB_WORKSPACE, 'scripts/deployment-notification.mjs')));
            const receipt = JSON.parse(fs.readFileSync(process.env.RECEIPT_PATH, 'utf8'));

            const existingIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              labels: 'ai-news-production',
              per_page: 100,
            });
            if (!helpers.shouldNotify(receipt, existingIssues)) {
              core.info('Verified production notification already exists for this deployment identity');
              return;
            }

            // Read latest.json
            const latestPath = path.join(process.env.GITHUB_WORKSPACE, 'data/latest.json');
            const latestData = JSON.parse(fs.readFileSync(latestPath, 'utf8'));

            // Read health.json (optional)
            let healthData = { validation_rate: 0 };
            const healthPath = path.join(process.env.GITHUB_WORKSPACE, 'data/health.json');
            if (fs.existsSync(healthPath)) {
              healthData = JSON.parse(fs.readFileSync(healthPath, 'utf8'));
            }

            // Extract date and time
            const date = latestData.date || new Date().toISOString().split('T')[0];
            // time 欄位是 ISO8601（如 "2026-05-12T11:38:34+08:00"），需從 T 後取 HH
            const timeStr = latestData.time || new Date().toISOString();
            const hour = parseInt(timeStr.includes('T') ? timeStr.split('T')[1].split(':')[0] : timeStr.split(':')[0]) || 0;

            // Determine period
            const period = hour < 12 ? '🌅 早班' : '🌆 午班';

            // Count total news items
            let totalCount = 0;
            const categoryData = {};
            if (latestData.data) {
              for (const [category, items] of Object.entries(latestData.data)) {
                const count = Array.isArray(items) ? items.length : 0;
                totalCount += count;
                categoryData[category] = { count, items: Array.isArray(items) ? items : [] };
              }
            }

            // Get validation rate
            const validationRate = latestData.validation?.pass_rate || healthData.validation_pass_rate || 'N/A';

            // Create issue title only after the verified receipt gate above.
            const action = receipt.kind === 'rollback' ? 'Cloudflare 回滾已驗證' : 'Cloudflare production 已驗證';
            const title = `✅ ${action} · AI News ${date} ${period} · ${totalCount} 筆`;

            // Build issue body
            let body = `${helpers.notificationMarker(receipt)}\n## ${action}\n\n`;

            // Status table
            body += `| 欄位 | 內容 |\n`;
            body += `|------|------|\n`;
            body += `| 驗證結果 | verified |\n`;
            body += `| 部署 SHA | \`${receipt.deploy_sha}\` |\n`;
            body += `| Release ID | \`${receipt.expected.release_id}\` |\n`;
            body += `| Content set SHA-256 | \`${receipt.expected.content_set_sha256}\` |\n`;
            body += `| Receipt ID | \`${receipt.receipt_id}\` |\n`;
            body += `| 日期 | ${date} |\n`;
            body += `| 時間 | ${timeStr.includes('T') ? timeStr.split('T')[1].slice(0,5) : (timeStr.slice(0,5) || 'N/A')} |\n`;
            body += `| 來源數 | ${latestData.source_count || 'N/A'} |\n`;
            body += `| 驗證率 | ${validationRate} |\n\n`;

            // Categories with top 3 items
            body += `## 📰 分類新聞\n\n`;
            for (const [category, data] of Object.entries(categoryData)) {
              body += `### ${category} (${data.count})\n`;
              const topItems = data.items.slice(0, 3);
              topItems.forEach((item, index) => {
                const rawTitle = (item && typeof item === 'object')
                  ? (item.title || item.model_name || item.name || '(無標題)')
                  : String(item);
                const title = String(rawTitle).replace(/\|/g, '\\|').replace(/\n/g, ' ');
                const url = (item && typeof item === 'object' && item.url) ? item.url : '#';
                body += `${index + 1}. [${title}](${url})\n`;
              });
              body += '\n';
            }

            // Footer CTA
            body += `---\n`;
            body += `🔗 [前往 AI News Hub 查看完整內容](https://ai-news-hub-7jk.pages.dev/)\n`;

            // Create or get the label
            const labelName = 'ai-news-production';
            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: labelName,
              });
            } catch (error) {
              if (error.status === 404) {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: labelName,
                  color: '0366d6',
                  description: 'Verified AI News Hub production deployments',
                });
              }
            }

            // Create issue
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: [labelName],
            });

            console.log(`Created issue #${issue.data.number}`);

            // Close old issues with ai-news-daily label (older than 7 days)
            const sevenDaysAgo = new Date();
            sevenDaysAgo.setDate(sevenDaysAgo.getDate() - 7);

            const oldIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: labelName,
              state: 'open',
              per_page: 100,
            });

            for (const issue of oldIssues.data) {
              const createdAt = new Date(issue.created_at);
              if (createdAt < sevenDaysAgo) {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  state: 'closed',
                });
                console.log(`Closed old issue #${issue.number}`);
              }
            }
